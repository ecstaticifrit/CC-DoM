<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kavach · Supplier payments{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2.5L27 6.8V15.4C27 22.1 22.3 27.6 16 29.5C9.7 27.6 5 22.1 5 15.4V6.8L16 2.5Z" fill="#12355B"/>
          <path d="M12 10.5V21.5M12 16L19.5 10.5M15.2 13.7L20.5 21.5" stroke="#F3F6FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Kavach</span>
        <span class="brand-sub">Supplier payments</span>
      </a>
      <span class="sandbox-pill"><span class="sandbox-dot" aria-hidden="true"></span>{{ config.sandbox_label }}</span>
    </div>
  </header>
  <main>{% block main %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
