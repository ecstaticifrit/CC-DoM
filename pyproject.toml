[project]
name = "kavach"
version = "0.1.0"
description = "Closes a logistics company's weekly carrier payment run."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.uv]
exclude-newer = "2026-11-15T00:00:00Z"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
